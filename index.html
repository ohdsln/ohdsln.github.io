
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Dasole Oh</title>

  <!-- Google Analytics 4 -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-3GDJTZR23T"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-3GDJTZR23T');
  </script>

  <!-- Wanted Sans -->
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/wanted-sans@1.0.3/fonts/webfonts/variable/split/WantedSansVariable.min.css"
  >

  <!-- Common CSS -->
  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <!-- COMMON HEADER -->
  <div id="site-header"></div>

  <!-- MAIN -->
  <main>
    <section class="artwork-area">
      <div class="artwork-frame">
        <img
          src="images/Montage-2405_Montage-2406.webp"
          alt="Montage 2405 and Montage 2406"
          draggable="false"
        >
      </div>
    </section>
  </main>

  <!-- FOOTER -->
  <footer>
    © Dasole Oh
  </footer>

  <!-- Common Navigation Script -->
  <script src="js/nav.js"></script>

  <!-- COPYRIGHT PROTECTION -->
  <script>
    const artwork = document.querySelector('.artwork-frame');

    /* Disable right-click without showing any message */
    artwork.addEventListener('contextmenu', (event) => {
      event.preventDefault();
    });

    /* Disable image dragging */
    artwork.addEventListener('dragstart', (event) => {
      event.preventDefault();
    });

    /* Disable long-press context menu on touch devices */
    artwork.addEventListener('touchstart', (event) => {
      // Touch interaction is otherwise left unchanged.
    }, { passive: true });
  </script>

</body>
</html>
