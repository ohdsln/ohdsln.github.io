
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Dasole Oh — Artist</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 60px 7%;
      font-family: 'Inter', Helvetica, Arial, sans-serif;
      color: #222;
      background: #fff;
      -webkit-font-smoothing: antialiased;
    }

    /* Header */

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 100px;
    }

    .logo {
      font-size: 18px;
      font-weight: 400;
      letter-spacing: -0.4px;
      color: #222;
      text-decoration: none;
    }

    nav {
      display: flex;
      gap: 32px;
    }

    nav a {
      color: #555;
      text-decoration: none;
      font-size: 13px;
      font-weight: 400;
      transition: color 0.2s ease;
    }

    nav a:hover {
      color: #000;
    }

    /* Main */

    main h1 {
      font-size: 34px;
      font-weight: 400;
      letter-spacing: -1px;
      margin-bottom: 50px;
    }

    .placeholder {
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #f1f0ed;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #999;
      font-size: 13px;
    }

    /* Footer */

    footer {
      margin-top: 100px;
      font-size: 12px;
      color: #999;
    }

    /* Mobile */

    @media (max-width: 600px) {
      body {
        padding: 30px 6%;
      }

      header {
        display: block;
        margin-bottom: 70px;
      }

      nav {
        margin-top: 25px;
        gap: 20px;
        flex-wrap: wrap;
      }

      nav a {
        font-size: 12px;
      }

      main h1 {
        font-size: 28px;
      }
    }
  </style>
</head>

<body>

  <header>
    <a href="index.html" class="logo">Dasole Oh</a>

    <nav>
      <a href="works.html">Works</a>
      <a href="exhibitions.html">Exhibitions</a>
      <a href="texts.html">Texts</a>
      <a href="cv-contact.html">CV/Contact</a>
    </nav>
  </header>

  <main>
    <h1>Selected Works</h1>

    <div class="placeholder">
      Artwork images will appear here.
    </div>
  </main>

  <footer>
    © 2026 Dasole Oh
  </footer>

</body>
</html>
