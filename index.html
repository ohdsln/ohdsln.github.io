
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Artist Portfolio</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 60px 7%;
      font-family: Arial, sans-serif;
      color: #222;
      background: #fff;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 100px;
    }

    .logo {
      font-size: 18px;
      font-weight: 500;
      letter-spacing: 1px;
    }

    nav a {
      margin-left: 28px;
      color: #555;
      text-decoration: none;
      font-size: 13px;
    }

    main h1 {
      font-size: 34px;
      font-weight: 400;
      margin-bottom: 50px;
    }

    .placeholder {
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #f1f0ed;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #999;
      font-size: 13px;
    }

    footer {
      margin-top: 100px;
      font-size: 12px;
      color: #999;
    }

    @media (max-width: 600px) {
      body {
        padding: 30px 6%;
      }

      header {
        display: block;
        margin-bottom: 70px;
      }

      nav {
        margin-top: 25px;
      }

      nav a {
        margin: 0 18px 0 0;
      }
    }
  </style>
</head>

<body>
  <header>
    <div class="logo">ARTIST NAME</div>
    <nav>
      <a href="#works">WORKS</a>
      <a href="#about">ABOUT</a>
      <a href="#contact">CONTACT</a>
    </nav>
  </header>

  <main>
    <h1 id="works">Selected Works</h1>
    <div class="placeholder">
      Artwork images will appear here.
    </div>
  </main>

  <footer id="contact">
    © 2026 ARTIST NAME
  </footer>
</body>
</html>
