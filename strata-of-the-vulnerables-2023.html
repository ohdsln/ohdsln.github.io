
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Strata of the Vulnerables (2023) | Dasole Oh</title>

  <!-- Google Analytics -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-3GDJTZR23T"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-3GDJTZR23T');
  </script>

  <!-- Fonts and Common CSS -->
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/wanteddev/wanted-sans@v1.0.1/packages/wanted-sans/fonts/webfonts/variable/complete/WantedSansVariable.min.css">

  <style>
    /* PAGE LAYOUT */
    main {
      width: 86%;
      max-width: 1400px;
      margin: 0 auto;
      padding: 52px 0 100px;
    }

    .page-heading {
      margin: 0 0 42px;
      text-align: center;
    }

    .page-title {
      margin: 0;
      color: #222222;
      font-size: 17px;
      font-weight: 400;
      line-height: 1.4;
      letter-spacing: -0.4px;
    }

    .page-title-en {
      display: block;
    }

    /* EXHIBITION INFORMATION AND POSTER */
    .exhibition-intro {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 7%;
      align-items: center;
      width: 100%;
      max-width: 760px;
      margin: 0 auto 80px;
    }

    .exhibition-info {
      padding-top: 4px;
      font-size: 14px;
      line-height: 1.8;
      color: #555555;
      text-align: left;
    }

    .info-item {
      margin-bottom: 17px;
    }

    .info-label {
      display: block;
      margin-bottom: 2px;
      color: #999999;
      font-size: 12px;
    }

    .info-value {
      display: block;
      color: #555555;
    }

    .poster-area {
      width: 100%;
      display: flex;
      justify-content: center;
    }

    .poster-placeholder {
      width: 100%;
      max-width: 215px;
      aspect-ratio: 3 / 4;
      background: #f5f5f5;
    }

    .poster-placeholder img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    /* INSTALLATION GALLERY */
    .installation-gallery {
      width: 100%;
      margin-bottom: 105px;
    }

    .gallery-main {
      position: relative;
      width: 100%;
      max-width: 1100px;
      margin: 0 auto;
      background: #f5f5f5;
    }

    .gallery-stage {
      position: relative;
      display: block;
      width: 100%;
      padding: 0;
      border: none;
      background: transparent;
      cursor: zoom-in;
    }

    .gallery-stage img {
      display: block;
      width: 100%;
      max-height: 760px;
      object-fit: contain;
      margin: 0 auto;
    }

    .gallery-placeholder {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      aspect-ratio: 16 / 9;
      color: #bbbbbb;
      font-size: 12px;
      font-weight: 400;
      background: #f5f5f5;
    }

    .gallery-controls {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: none;
    }

    .gallery-arrow {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 48px;
      height: 70px;
      border: none;
      background: rgba(255, 255, 255, 0.65);
      color: #555555;
      font-size: 27px;
      font-weight: 300;
      cursor: pointer;
      pointer-events: auto;
      transition: background 0.2s ease, color 0.2s ease;
    }

    .gallery-arrow:hover {
      background: rgba(255, 255, 255, 0.95);
      color: #03a890;
    }

    .gallery-counter {
      position: absolute;
      right: 0;
      bottom: 0;
      padding: 9px 13px;
      color: #777777;
      font-size: 11px;
      background: rgba(255, 255, 255, 0.8);
    }

    /* THUMBNAILS */
    .thumbnail-list {
      display: flex;
      justify-content: center;
      gap: 8px;
      width: fit-content;
      max-width: 100%;
      margin: 12px auto 0;
      overflow-x: auto;
      padding-bottom: 5px;
    }

    .thumbnail {
      flex: 0 0 115px;
      position: relative;
      padding: 0;
      border: 1px solid transparent;
      background: #f5f5f5;
      cursor: pointer;
      aspect-ratio: 4 / 3;
      overflow: hidden;
    }

    .thumbnail img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .thumbnail-placeholder {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
      color: #bbbbbb;
      font-size: 11px;
    }

    .thumbnail.is-active {
      border: 1px solid #03a890;
    }

    /* EXHIBITION TEXTS */
    .exhibition-texts {
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
      text-align: left;
    }

    .exhibition-text {
      margin-bottom: 65px;
    }

    .language-switch {
      display: flex;
      gap: 18px;
      margin-bottom: 12px;
    }

    .language-button {
      padding: 0;
      border: none;
      background: none;
      color: #999999;
      font-family: inherit;
      font-size: 13px;
      font-weight: 400;
      cursor: pointer;
      transition: color 0.2s ease;
    }

    .language-button:hover,
    .language-button.is-active {
      color: #03a890;
    }

    .text-title {
      margin: 0 0 20px;
      font-size: 17px;
      font-weight: 400;
      line-height: 1.5;
      color: #333333;
    }

    .text-content {
      color: #555555;
      font-size: 14px;
      font-weight: 400;
      line-height: 1.9;
      white-space: pre-line;
    }

    .text-content p {
      margin: 0 0 18px;
    }

    .text-content[hidden] {
      display: none;
    }

    /* IMAGE MODAL */
    .image-modal {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 1000;
      align-items: center;
      justify-content: center;
      padding: 40px 70px;
      background: rgba(0, 0, 0, 0.94);
    }

    .image-modal.is-open {
      display: flex;
    }

    .modal-image-wrap {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
    }

    .modal-image {
      display: block;
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }

    .modal-close {
      position: absolute;
      top: 22px;
      right: 28px;
      width: 42px;
      height: 42px;
      padding: 0;
      border: none;
      background: transparent;
      color: #ffffff;
      font-size: 30px;
      font-weight: 300;
      cursor: pointer;
    }

    .modal-arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 48px;
      height: 70px;
      border: none;
      background: transparent;
      color: #ffffff;
      font-size: 34px;
      font-weight: 300;
      cursor: pointer;
      transition: color 0.2s ease;
    }

    .modal-arrow:hover,
    .modal-close:hover {
      color: #03a890;
    }

    .modal-prev {
      left: 12px;
    }

    .modal-next {
      right: 12px;
    }

    .modal-counter {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      color: #ffffff;
      font-size: 12px;
    }

    body.modal-open {
      overflow: hidden;
    }

    /* TABLET */
    @media (max-width: 768px) {
      main {
        width: 88%;
        padding-top: 38px;
        padding-bottom: 75px;
      }

      .page-heading {
        margin-bottom: 35px;
      }

      .exhibition-intro {
        gap: 5%;
        margin-bottom: 60px;
      }

      .exhibition-info {
        font-size: 13px;
      }

      .poster-placeholder {
        max-width: 215px;
      }

      .gallery-arrow {
        width: 38px;
        height: 58px;
        font-size: 23px;
      }

      .thumbnail {
        flex-basis: 95px;
      }

      .installation-gallery {
        margin-bottom: 80px;
      }

      .exhibition-texts {
        max-width: 100%;
      }

      .text-title {
        font-size: 16px;
      }

      .text-content {
        font-size: 13px;
      }

      .image-modal {
        padding: 35px 45px;
      }
    }

    /* MOBILE */
    @media (max-width: 420px) {
      main {
        width: 88%;
        padding-top: 30px;
      }

      .page-heading {
        margin-bottom: 30px;
      }

      .exhibition-intro {
        grid-template-columns: 1fr 1fr;
        gap: 5%;
        margin-bottom: 45px;
      }

      .exhibition-info {
        font-size: 12px;
        line-height: 1.7;
      }

      .info-item {
        margin-bottom: 12px;
      }

      .info-label {
        font-size: 11px;
      }

      .poster-placeholder {
        max-width: 100%;
      }

      .gallery-placeholder {
        aspect-ratio: 4 / 3;
      }

      .gallery-arrow {
        width: 30px;
        height: 48px;
        font-size: 20px;
      }

      .gallery-counter {
        font-size: 10px;
        padding: 7px 9px;
      }

      .thumbnail-list {
        gap: 6px;
        margin-top: 8px;
      }

      .thumbnail {
        flex-basis: 75px;
      }

      .installation-gallery {
        margin-bottom: 65px;
      }

      .exhibition-text {
        margin-bottom: 50px;
      }

      .language-switch {
        gap: 15px;
        margin-bottom: 10px;
      }

      .language-button {
        font-size: 12px;
      }

      .text-title {
        font-size: 15px;
        margin-bottom: 15px;
      }

      .text-content {
        font-size: 12px;
        line-height: 1.85;
      }

      .image-modal {
        padding: 35px 30px;
      }

      .modal-close {
        top: 12px;
        right: 12px;
        font-size: 27px;
      }

      .modal-arrow {
        width: 30px;
        font-size: 27px;
      }

      .modal-prev {
        left: 0;
      }

      .modal-next {
        right: 0;
      }
    }
  </style>
</head>

<body>

  <!-- COMMON HEADER -->
  <div id="site-header"></div>

  <!-- MAIN -->
  <main>

    <div class="page-heading">
      <h1 class="page-title">
        개인전 : 연약한 것들의 지층
        <span class="page-title-en">Solo Exhibition: Strata of the Vulnerables</span>
      </h1>
    </div>

    <!-- EXHIBITION INFORMATION / POSTER -->
    <section class="exhibition-intro">

      <div class="exhibition-info">

        <div class="info-item">
          <span class="info-label">기간 / Date</span>
          <span class="info-value">
            2023. 4. 1–22.
          </span>
        </div>

        <div class="info-item">
          <span class="info-label">장소 / Venue</span>
          <span class="info-value">
            배다리 잇다스페이스 작은미술관 (인천)<br>
            Baedari Itta Space (Incheon, Korea)
          </span>
        </div>

      </div>

      <div class="poster-area">
        <div class="poster-placeholder">
          <!-- 포스터 이미지 경로를 여기에 추가 -->
          <!-- 예: <img src="images/strata-2023-poster.jpg" alt="Strata of the Vulnerables exhibition poster"> -->
        </div>
      </div>

    </section>


    <!-- INSTALLATION GALLERY -->
    <section class="installation-gallery">

      <div class="gallery-main">

        <button class="gallery-stage" id="gallery-stage" type="button" aria-label="이미지 확대 보기">
          <div class="gallery-placeholder" id="gallery-placeholder">
            Installation View
          </div>
          <img id="gallery-main-image" src="" alt="" hidden>
        </button>

        <div class="gallery-controls">
          <button class="gallery-arrow" id="gallery-prev" type="button" aria-label="이전 이미지">‹</button>
          <button class="gallery-arrow" id="gallery-next" type="button" aria-label="다음 이미지">›</button>
        </div>

        <div class="gallery-counter" id="gallery-counter">01 / 05</div>

      </div>

      <div class="thumbnail-list" id="thumbnail-list">
        <!-- 썸네일은 JavaScript에서 생성 -->
      </div>

    </section>


    <!-- EXHIBITION TEXTS -->
    <section class="exhibition-texts">

      <!-- FOREWORD -->
      <article class="exhibition-text">

        <div class="language-switch" data-language-group="foreword">
          <button class="language-button is-active" type="button" data-language="ko">한국어</button>
          <button class="language-button" type="button" data-language="en">English</button>
        </div>

        <h2 class="text-title">Foreword</h2>

        <div class="text-content" data-language-group="foreword" data-language="ko">
          <!-- 여기에 한국어 서문을 입력 -->
        </div>

        <div class="text-content" data-language-group="foreword" data-language="en" hidden>
          <!-- Enter the English foreword here -->
        </div>

      </article>


      <!-- CRITICAL ESSAY -->
      <article class="exhibition-text">

        <div class="language-switch" data-language-group="essay">
          <button class="language-button is-active" type="button" data-language="ko">한국어</button>
          <button class="language-button" type="button" data-language="en">English</button>
        </div>

        <h2 class="text-title">Critical Essay</h2>

        <div class="text-content" data-language-group="essay" data-language="ko">
          <!-- 여기에 한국어 비평문을 입력 -->
        </div>

        <div class="text-content" data-language-group="essay" data-language="en" hidden>
          <!-- Enter the English critical essay here -->
        </div>

      </article>

    </section>

  </main>


  <!-- IMAGE MODAL -->
  <div class="image-modal" id="image-modal" aria-hidden="true">

    <button class="modal-close" id="modal-close" type="button" aria-label="닫기">×</button>

    <button class="modal-arrow modal-prev" id="modal-prev" type="button" aria-label="이전 이미지">‹</button>

    <div class="modal-image-wrap">
      <img class="modal-image" id="modal-image" src="" alt="">
    </div>

    <button class="modal-arrow modal-next" id="modal-next" type="button" aria-label="다음 이미지">›</button>

    <div class="modal-counter" id="modal-counter">01 / 05</div>

  </div>


  <!-- FOOTER -->
  <footer>© Dasole Oh</footer>


  <!-- GALLERY SCRIPT -->
  <script>
    /*
      설치 전경 이미지 경로를 아래 배열에 입력하면 됩니다.

      예:
      { src: "images/strata-2023-01.jpg", alt: "Installation view 01" }

      이미지가 준비되기 전에는 빈 문자열로 둡니다.
    */

    const galleryImages = [
      { src: "", alt: "Installation view 01" },
      { src: "", alt: "Installation view 02" },
      { src: "", alt: "Installation view 03" },
      { src: "", alt: "Installation view 04" },
      { src: "", alt: "Installation view 05" }
    ];

    let currentIndex = 0;

    const galleryStage = document.getElementById('gallery-stage');
    const galleryMainImage = document.getElementById('gallery-main-image');
    const galleryPlaceholder = document.getElementById('gallery-placeholder');
    const thumbnailList = document.getElementById('thumbnail-list');
    const galleryCounter = document.getElementById('gallery-counter');

    const imageModal = document.getElementById('image-modal');
    const modalImage = document.getElementById('modal-image');
    const modalCounter = document.getElementById('modal-counter');

    const totalImages = galleryImages.length;


    function updateCounter() {
      const number = String(currentIndex + 1).padStart(2, '0');
      const total = String(totalImages).padStart(2, '0');

      galleryCounter.textContent = `${number} / ${total}`;
      modalCounter.textContent = `${number} / ${total}`;
    }


    function renderGallery() {
      const image = galleryImages[currentIndex];

      if (image.src) {
        galleryMainImage.src = image.src;
        galleryMainImage.alt = image.alt;
        galleryMainImage.hidden = false;
        galleryPlaceholder.hidden = true;
      } else {
        galleryMainImage.hidden = true;
        galleryMainImage.removeAttribute('src');
        galleryPlaceholder.hidden = false;
      }

      document.querySelectorAll('.thumbnail').forEach((thumbnail, index) => {
        thumbnail.classList.toggle('is-active', index === currentIndex);
      });

      updateCounter();
    }


    function createThumbnails() {
      thumbnailList.innerHTML = '';

      galleryImages.forEach((image, index) => {
        const thumbnail = document.createElement('button');
        thumbnail.type = 'button';
        thumbnail.className = 'thumbnail';
        thumbnail.setAttribute('aria-label', `Installation view ${index + 1}`);

        if (image.src) {
          const img = document.createElement('img');
          img.src = image.src;
          img.alt = image.alt;
          thumbnail.appendChild(img);
        } else {
          const placeholder = document.createElement('span');
          placeholder.className = 'thumbnail-placeholder';
          placeholder.textContent = String(index + 1).padStart(2, '0');
          thumbnail.appendChild(placeholder);
        }

        thumbnail.addEventListener('click', () => {
          currentIndex = index;
          renderGallery();
        });

        thumbnailList.appendChild(thumbnail);
      });

      renderGallery();
    }


    function moveImage(direction) {
      currentIndex = (currentIndex + direction + totalImages) % totalImages;
      renderGallery();

      if (imageModal.classList.contains('is-open')) {
        updateModalImage();
      }
    }


    function openModal() {
      const image = galleryImages[currentIndex];

      if (!image.src) return;

      imageModal.classList.add('is-open');
      imageModal.setAttribute('aria-hidden', 'false');
      document.body.classList.add('modal-open');

      updateModalImage();
    }


    function updateModalImage() {
      const image = galleryImages[currentIndex];

      if (!image.src) return;

      modalImage.src = image.src;
      modalImage.alt = image.alt;
      updateCounter();
    }


    function closeModal() {
      imageModal.classList.remove('is-open');
      imageModal.setAttribute('aria-hidden', 'true');
      document.body.classList.remove('modal-open');
    }


    document.getElementById('gallery-prev').addEventListener('click', () => {
      moveImage(-1);
    });

    document.getElementById('gallery-next').addEventListener('click', () => {
      moveImage(1);
    });

    galleryStage.addEventListener('click', openModal);

    document.getElementById('modal-prev').addEventListener('click', (event) => {
      event.stopPropagation();
      moveImage(-1);
    });

    document.getElementById('modal-next').addEventListener('click', (event) => {
      event.stopPropagation();
      moveImage(1);
    });

    document.getElementById('modal-close').addEventListener('click', closeModal);

    imageModal.addEventListener('click', (event) => {
      if (
        event.target === imageModal ||
        event.target === modalImage.parentElement
      ) {
        closeModal();
      }
    });

    document.addEventListener('keydown', (event) => {
      if (!imageModal.classList.contains('is-open')) return;

      if (event.key === 'Escape') {
        closeModal();
      }

      if (event.key === 'ArrowLeft') {
        moveImage(-1);
      }

      if (event.key === 'ArrowRight') {
        moveImage(1);
      }
    });


    createThumbnails();

  </script>


  <!-- LANGUAGE SWITCH SCRIPT -->
  <script>
    document.querySelectorAll('.language-switch').forEach(switchGroup => {
      const groupName = switchGroup.dataset.languageGroup;
      const buttons = switchGroup.querySelectorAll('.language-button');

      buttons.forEach(button => {
        button.addEventListener('click', () => {
          const language = button.dataset.language;

          buttons.forEach(item => {
            item.classList.toggle('is-active', item === button);
          });

          document.querySelectorAll(
            `.text-content[data-language-group="${groupName}"]`
          ).forEach(content => {
            content.hidden = content.dataset.language !== language;
          });
        });
      });
    });
  </script>


  <!-- COMMON NAVIGATION SCRIPT -->
  <script src="js/nav.js"></script>

</body>
</html>
